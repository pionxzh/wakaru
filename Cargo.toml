[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.13.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pionxzh/wakaru"

[workspace.dependencies]
wakaru = { version = "=1.13.0", path = "crates/wakaru" }
wakaru-core = { version = "=1.13.0", path = "crates/core" }
wakaru-formatter = { path = "crates/formatter" }
anyhow = "1.0"
sourcemap = "9"
swc_core = { version = "=82.0.0", features = [
  "common",
  "ecma_ast",
  "ecma_codegen",
  "ecma_parser",
  "ecma_parser_typescript",
  "ecma_transforms",
  "ecma_utils",
  "ecma_visit",
] }
tracing = "0.1"

# Dev/test iteration profile. Full DWARF is the dominant link cost across the
# 90+ swc_core-linked test binaries; line-tables keep panic backtraces with
# file:line while cutting debuginfo generation and link size. unpacked split
# debuginfo stops the linker copying debug info into each binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Shipped binaries (the release workflow). Not for local checks.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Performance numbers (fixtures --perf, perf work): close to release codegen
# without fat LTO's build time.
[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16

# Optimized CLI for output checks that rebuild after every edit (the
# wakaru-fixtures runner, the synthetic harness, the Vue public corpus).
# Without LTO and with
# incremental codegen, a one-rule change relinks in well under half the
# dev-release time. Use dev-release or release for performance numbers.
[profile.dev-opt]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
incremental = true
